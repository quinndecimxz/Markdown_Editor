<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Markdown Slides</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Markdown Slides</h1>
        <button id="saveButton">Save</button>
        <button id="presentationButton">Presentation Mode</button>
    </header>

    <main>
        <!-- Editor and preview screen -->
        <section id="editorScreen">
            <div class="container">
                <div class="editor">
                    <h3>Markdown Input</h3>

                    <textarea id="markdownInput"># Hello World

This is **bold text**.

- First item
- Second item

---

# Second Slide

This is my second slide.

---

# Third Slide

This is my final slide.</textarea>
                </div>

                <div class="preview">
                    <h3>Preview</h3>
                    <div id="viewer"></div>

                    <div class="controls">
                        <button id="prevButton" disabled>← Previous</button>
                        <span id="slideCounter">1 / 3</span>
                        <button id="nextButton">Next →</button>
                        <button id="editorFullscreen">Fullscreen</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Presentation screen -->
        <section id="presentationScreen" hidden>
            <div id="presentationSlide"></div>

            <div class="controls">
                <button id="editButton">← Edit</button>
                <button id="presentPrev" disabled>← Previous</button>
                <span id="presentCounter">1 / 3</span>
                <button id="presentNext">Next →</button>
                <button id="presentFullscreen">Fullscreen</button>
            </div>
        </section>

        <p id="saveStatus"></p>
    </main>
</body>
</html>
